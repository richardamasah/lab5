# Workflow Name: Deploy Step Function
# This is the name that will appear in the GitHub Actions UI for this workflow.
name: Deploy Step Function

# Event Trigger: When to run this workflow.
# This workflow is configured to run automatically on specific Git events.
on:
  push:
    # Branches: Specifies on which branches the 'push' event will trigger the workflow.
    # In this case, the workflow will only run when changes are pushed to the 'lab5' branch.
    branches: [ lab5 ]

# Jobs: Defines the set of jobs that will be executed as part of this workflow.
# A workflow can have one or more jobs, which run in parallel by default.
jobs:
  # Job Name: 'deploy-step-function'
  # This job is responsible for deploying the AWS Step Function.
  deploy-step-function:
    # Runner Environment: Specifies the type of machine the job will run on.
    # 'ubuntu-latest' means the job will execute on the latest available Ubuntu Linux runner.
    runs-on: ubuntu-latest

    # Steps: A sequence of tasks that will be executed within this job.
    # Each step can be a shell command, an action, or a composite run step.
    steps:
      # Step 1: Checkout code
      # This action checks out your repository code onto the runner machine.
      # It's essential for accessing your project files, including the Step Function definition.
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Configure AWS credentials
      # This action sets up AWS credentials on the runner, allowing subsequent AWS CLI commands to authenticate.
      # It uses GitHub Secrets to securely retrieve the AWS Access Key ID and Secret Access Key.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          # AWS Access Key ID, retrieved from GitHub Secrets for security.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS Secret Access Key, retrieved from GitHub Secrets for security.
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # The AWS region where the Step Function is deployed.
          aws-region: eu-north-1

      # Step 3: Deploy Step Function
      # This step uses the AWS CLI to update the Step Function state machine.
      # It reads the state machine definition from a local JSON file and updates the specified ARN.
      - name: Deploy Step Function
        run: |
          # AWS CLI command to update the state machine.
          # '--state-machine-arn': Specifies the Amazon Resource Name (ARN) of the Step Function to update.
          # '--definition': Provides the path to the JSON file containing the new state machine definition.
          # '--role-arn': Specifies the IAM role ARN that the Step Function will assume for execution.
          aws stepfunctions update-state-machine \
            --state-machine-arn arn:aws:states:eu-north-1:992382846559:stateMachine:lakehouse-pipeline-stepfxn \
            --definition file://state_machine/lakehouse-pipeline.json \
            --role-arn arn:aws:iam::992382846559:role/StepFunctions-lakehouse-pipeline-stepfxn-role-5w3548kbi
