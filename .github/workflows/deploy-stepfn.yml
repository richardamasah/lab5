name: Deploy Step Function

on:
  push:
    
    branches: [ lab5 ]

jobs:
  deploy-step-function:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy Step Function
        run: |
          aws stepfunctions update-state-machine \
            --state-machine-arn arn:aws:states:eu-north-1:992382846559:stateMachine:lakehouse-pipeline-stepfxn \
            --definition file://state_machine/lakehouse-pipeline.json \
            --role-arn arn:aws:iam::992382846559:role/StepFunctions-lakehouse-pipeline-stepfxn-role-5w3548kbi
